<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2326" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mine</title>

  <link rel="stylesheet" href="css/theme.css?v6" />
  <link rel="stylesheet" href="css/base.css?v6" />
  <link rel="stylesheet" href="css/home.css?v6" />
  <link rel="stylesheet" href="css/components.css?v7" />
  <link rel="stylesheet" href="css/contacts.css?v9" />
  <link rel="stylesheet" href="css/chat.css?v24" />
  <link rel="stylesheet" href="css/companion.css?v2" />
  <link rel="stylesheet" href="css/profile.css?v1" />
  <link rel="stylesheet" href="css/mail.css?v6" />
  <link rel="stylesheet" href="css/treehole.css?v6" />
</head>
<body>

  <div class="bg-stack">
    <div class="bg-layer bg-base"></div>
    <div class="bg-layer bg-image"></div>
    <div class="bg-layer bg-fog-tint"></div>
    <div class="bg-layer bg-noise"></div>
    <div class="bg-layer bg-vignette"></div>
  </div>

  <main class="app-shell">

    <section class="page is-active" data-page="home">

      <header class="status-bar">
        <span class="status-time" id="status-time">--:--</span>
        <div class="status-indicators">
          <span class="sig-dots"><i></i><i></i><i></i><i></i></span>
          <span id="status-wifi"></span>
          <span class="battery">
            <span class="battery-body"><span class="battery-fill"></span></span>
          </span>
        </div>
      </header>

      <div class="app-grid-wrap scroll">
        <div class="greeting">
          <div class="hello">你好</div>
          <div class="date">—</div>
        </div>

        <div class="search-pill" role="button" tabindex="0">
          <span id="search-icon"></span>
          <span>搜索应用…</span>
        </div>

        <div class="app-grid" id="app-grid"></div>
      </div>

      <div class="page-dots"><i class="is-active"></i><i></i></div>

      <nav class="dock">
        <div class="dock-inner" id="dock-inner"></div>
      </nav>
    </section>

    <section class="page" data-page="detail" id="page-detail"></section>
    <section class="page" data-page="contacts" id="page-contacts"></section>
    <section class="page" data-page="chat" id="page-chat"></section>
    <section class="page" data-page="companion" id="page-companion"></section>

  </main>

  <script src="js/utils.js?v8"></script>
  <script src="js/icons.js?v11"></script>
  <script src="js/background.js?v7"></script>
  <script src="js/contacts.js?v15"></script>
  <script src="js/chat.js?v24"></script>
  <script src="js/companion.js?v4"></script>
  <script src="js/profile.js?v2"></script>
  <script src="js/mail.js?v6"></script>
  <script src="js/treehole.js?v6"></script>
  <script src="js/app.js?v9"></script>
  <script>
    document.getElementById("status-wifi").innerHTML = MineIcons.svg("wifi", 16);
    document.getElementById("search-icon").innerHTML = MineIcons.svg("search", 16);
  </script>
</body>
</html>
