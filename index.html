<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2326" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mine</title>
  <link rel="stylesheet" href="theme.css?v6" />
  <link rel="stylesheet" href="base.css?v6" />
  <link rel="stylesheet" href="home.css?v6" />
  <link rel="stylesheet" href="components.css?v7" />
  <link rel="stylesheet" href="contacts.css?v9" />
  <link rel="stylesheet" href="chat.css?v30" />
  <link rel="stylesheet" href="companion.css?v2" />
  <link rel="stylesheet" href="profile.css?v1" />
  <link rel="stylesheet" href="mail.css?v4" />
  <link rel="stylesheet" href="treehole.css?v4" />
  <link rel="stylesheet" href="radio.css?v2" />
  <link rel="stylesheet" href="foodie.css?v3" />
  <link rel="stylesheet" href="moments.css?v2" />
  <link rel="stylesheet" href="contact-moments.css?v2" />
  <link rel="stylesheet" href="notify.css?v1" />
</head>
<body>
  <div class="bg-stack">
    <div class="bg-layer bg-base"></div>
    <div class="bg-layer bg-image"></div>
    <div class="bg-layer bg-fog-tint"></div>
    <div class="bg-layer bg-noise"></div>
    <div class="bg-layer bg-vignette"></div>
  </div>
  <main class="app-shell">
    <section class="page is-active" data-page="home">
      <header class="status-bar">
        <span class="status-time" id="status-time">--:--</span>
        <div class="status-indicators">
          <span class="sig-dots"><i></i><i></i><i></i><i></i></span>
          <span id="status-wifi"></span>
          <span class="battery">
            <span class="battery-body"><span class="battery-fill"></span></span>
          </span>
        </div>
      </header>
      <div class="app-grid-wrap scroll">
        <div class="greeting">
          <div class="hello">你好</div>
          <div class="date">-</div>
        </div>
        <div class="search-pill" role="button" tabindex="0">
          <span id="search-icon"></span>
          <span>搜索应用...</span>
        </div>
        <div class="app-grid" id="app-grid"></div>
      </div>
      <div class="page-dots"><i class="is-active"></i><i></i></div>
      <nav class="dock">
        <div class="dock-inner" id="dock-inner"></div>
      </nav>
    </section>
    <section class="page" data-page="detail" id="page-detail"></section>
    <section class="page" data-page="contacts" id="page-contacts"></section>
    <section class="page" data-page="chat" id="page-chat"></section>
    <section class="page" data-page="companion" id="page-companion"></section>
    <section class="page" data-page="moments" id="page-moments"></section>
  </main>
  <script src="utils.js?v8"></script>
  <script src="notify.js?v1"></script>
  <script src="icons.js?v16"></script>
  <script src="background.js?v7"></script>
  <script src="contacts.js?v18"></script>
  <script src="chat.js?v37"></script>
  <script src="companion.js?v7"></script>
  <script src="profile.js?v5"></script>
  <script src="mail.js?v9"></script>
  <script src="treehole.js?v6"></script>
  <script src="radio.js?v2"></script>
  <script src="foodie.js?v3"></script>
  <script src="moments.js?v2"></script>
  <script src="contact-moments.js?v1"></script>
  <script src="app.js?v9"></script>
  <script>
    document.getElementById("status-wifi").innerHTML = MineIcons.svg("wifi", 16);
    document.getElementById("search-icon").innerHTML = MineIcons.svg("search", 16);
  </script>
</body>
          </html>
